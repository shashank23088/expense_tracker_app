# Publish a release named like v1.2.0 on GitHub (Releases -> Draft a new release), or push a tag v1.2.0:
# this builds a signed APK and attaches it to that release. Obtainium picks up new versions from Releases.
name: Release APK

on:
  release:
    types: [published]
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

# creating a release in the UI can fire both events; run them one at a time per tag
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Android build tools (Ubuntu packages, no Gradle)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            android-sdk-build-tools android-sdk-platform-23 apksigner zipalign aapt dalvik-exchange

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::KEYSTORE_B64 secret is not set"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore

      - name: Build APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag must look like v1.2.3, got $TAG"; exit 1; }
          V="${TAG#v}"
          IFS=. read -r MA MI PA <<< "$V"
          VERSION_NAME="$V" VERSION_CODE=$((MA * 10000 + MI * 100 + PA)) ./build.sh

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/ExpenseTracker.apk --clobber
